<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculadora">
      <h1>Calculadora</h1>

      <div class="visor" id="visor">0</div>

      <div class="botoes">
        <button data-action="clear" class="especial">AC</button>
        <button data-action="delete" class="especial">DEL</button>
        <button data-operator="/" class="operador">÷</button>
        <button data-operator="*" class="operador">×</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-operator="-" class="operador">−</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-operator="+" class="operador">+</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-action="calculate" class="igual">=</button>

        <button data-number="0" class="zero">0</button>
        <button data-action="decimal">.</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
